name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential python3

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build executables
      run: cmake --build build --config Release -j $(nproc)

    - name: Run Cache Unit Tests
      run: ./build/test_cache

    - name: Run Consistent Hashing Unit Tests
      run: ./build/test_hash

    - name: Start Server & Test Integration
      run: |
        ./build/kv_server --port 6380 --capacity 10000 &
        SERVER_PID=$!
        sleep 2
        # Run python benchmark smoke test
        python3 benchmark/benchmark.py --port 6380 --clients 4 --ops 2000 --pipeline 25
        kill $SERVER_PID
